name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: obra-clara-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release input
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:unit && pnpm test:integration && pnpm test:api
      - name: Deploy and smoke-test production
        run: node scripts/cloudflare/deploy-production.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_HOSTNAME: ${{ vars.TURNSTILE_HOSTNAME }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          MODERATOR_EMAILS: ${{ vars.MODERATOR_EMAILS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DEMO_MODE: 'false'
          ENVIRONMENT: production
          TURNSTILE_ACTION: community_submission
      - name: Upload safe deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-diagnostics
          path: deployment-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 14
