name: Temporary demo preview

on:
  push:
    branches:
      - deploy/temporary-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obra-clara-temporary-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy isolated demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and deploy temporary preview
        run: node scripts/deploy-temporary-preview.mjs
